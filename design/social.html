<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1280px; height: 640px; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; gap: 64px; align-items: center; }
  .copy { flex: 1; display: flex; flex-direction: column; gap: 26px; }
  .eyebrow { font-family: var(--font-mono); font-size: 20px; color: var(--faint); }
  h1 { font-size: 68px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; }
  .pkg { font-family: var(--font-mono); font-size: 24px; color: var(--text-2); }
  p { font-size: 28px; line-height: 1.4; color: var(--text-2); max-width: 560px; }
  .panel { flex: 0 0 440px; border: 1px solid var(--border); background: var(--panel); }
  .panel-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 16px; color: var(--faint); }
  .scan { margin: 14px; padding: 16px 0; background: var(--scan-bg); background-image: repeating-linear-gradient(0deg, var(--scan-line) 0 1px, transparent 1px 4px); }
  .row { display: flex; justify-content: space-between; margin: 0 14px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 18px; }
  .row + .row { margin-top: 10px; }
  .row span { color: var(--faint); }
  .row.dim { color: var(--text-2); }
  .exit { padding: 4px 20px 18px; font-family: var(--font-mono); font-size: 16px; color: var(--faint); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 36px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { height: 30px; }
  .url { font-family: var(--font-mono); font-size: 20px; color: var(--faint); }
</style>
<div class="wrap">
  <div class="copy">
    <div class="eyebrow">&gt;_ {{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <div class="pkg">{{PKG}}</div>
    <p>{{TAGLINE}}</p>
  </div>
  <div class="panel">
    <div class="panel-head">{{HEAD}}</div>
    <div class="scan">{{ROWS}}</div>
    <div class="exit">{{EXIT}}</div>
  </div>
</div>
<div class="foot"><div class="wordmark">{{WORDMARK}}</div><div class="url">byo.dev · github.com/byo-oss</div></div>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "dark";</script>
